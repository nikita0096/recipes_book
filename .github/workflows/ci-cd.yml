name: CI/CD Pipeline

  on:
    push:
      branches:
        - main
    pull_request:
      branches:
        - main

  jobs:
    test:
      name: Run Tests
      runs-on: ubuntu-latest

      steps:
        # Checkout the repository code
        - name: Checkout code
          uses: actions/checkout@v4

        # Setup Node.js environment
        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: '20'
            cache: 'npm'

        # Install dependencies using clean install for
  reproducibility
  - name: Install dependencies
    run: npm ci

  # Run unit tests from tests directory only -
  deployment will not run if this fails
  - name: Run unit tests
    run: npm test -- tests

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    # Only run if tests pass
    needs: test
    # Only deploy on push to main branch (skip PRs)
    if: github.event_name == 'push' && github.ref ==
  'refs/heads/main'

  steps:
    # Checkout the repository code
    - name: Checkout code
      uses: actions/checkout@v4

    # Setup Node.js environment
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    # Install dependencies
    - name: Install dependencies
      run: npm ci

    # Build the project for production
    - name: Build project
      run: npm run build

    # ========================================
    # DEPLOYMENT STEP - Replace with your actual
  deployment
  # ========================================         
  # Examples of common deployment targets:           
  # - Vercel: npx vercel --prod --token=${{          
  secrets.VERCEL_TOKEN }}
  # - Netlify: npx netlify deploy --prod --auth=${{  
  secrets.NETLIFY_TOKEN }}
  # - AWS S3: aws s3 sync ./out s3://your-bucket     
  --delete
  # - Custom server: rsync -avz ./out                
  user@server:/var/www/html
  - name: Deploy to production
    run: |
      echo "🚀 Starting deployment..."               
      echo "✅ Deployment completed successfully!"   
      # INSERT YOUR DEPLOYMENT COMMANDS HERE